server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/corporate_website?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

# DeepSeek API 配置
deepseek:
  api-key: 
  api-url: https://api.deepseek.com/chat/completions
  model: deepseek-chat
  max-tokens: 500
  temperature: 0.7
  system-prompt: |
    你是XX科技的AI智能顾问，专门为客户提供咨询服务。
    你的职责：
    1. 友好、专业地回答客户关于公司产品和服务的问题
    2. 介绍公司的核心业务：企业级解决方案、技术研发、品牌营销、数字化转型咨询
    3. 对于无法回答的问题，建议客户留下联系方式或拨打400-XXX-XXXX
    4. 保持回答简洁（不超过200字），语气亲切专业
    5. 如果客户表达合作意向，引导其在联系页面填写表单

# JWT 配置
jwt:
  secret: corporate-website-jwt-secret-key-2024-please-change-in-production
  expiration: 86400000

# 管理员默认账号（首次启动时自动创建）
admin:
  username: admin
  password: admin123
